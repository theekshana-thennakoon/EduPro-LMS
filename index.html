<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EduPro LMS - Modern Learning Management System</title>
    <meta name="description" content="Next-Generation Learning Management System for Teachers and Students" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#090d16;font-family:'Plus Jakarta Sans',sans-serif;color:#f8fafc;text-align:center;padding:1.5rem;">
        <div style="width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#6366f1 0%,#3730a3 100%);display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 12px 28px rgba(99,102,241,0.35);margin-bottom:1.5rem;">
          🎓
        </div>
        <div style="font-size:1.65rem;font-weight:800;letter-spacing:-0.5px;margin-bottom:0.35rem;background:linear-gradient(135deg,#f8fafc 0%,#6366f1 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
          EduPro LMS
        </div>
        <div style="font-size:0.85rem;color:#94a3b8;margin-bottom:1.75rem;">
          Next-Gen Academic Learning Platform
        </div>
        <div style="width:34px;height:34px;border:3px solid rgba(99,102,241,0.2);border-top-color:#6366f1;border-radius:50%;animation:spin 0.9s linear infinite;"></div>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
